name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # The source workbook is not committed - CMS republishes it in place, so
      # a checked-in copy would drift from what `scripts/load_data.py`
      # downloads. These run against fixtures and in-memory SQLite instead;
      # nothing here touches the network or a real database file.
      - name: Test
        run: pytest -q
